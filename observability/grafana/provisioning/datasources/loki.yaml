apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    version: 1
    editable: false
    jsonData:
      maxLines: 5000
      # Derived fields let you click a sagaId in any log line and jump to
      # a pre-filtered view showing every log line for that saga across all services.
      derivedFields:
        - name: sagaId
          matcherRegex: '"sagaId":"([^"]+)"'
          url: '/explore?left={"datasource":"Loki","queries":[{"expr":"{service=~\\".+\\"} | json | sagaId = \\"${__value.raw}\\"","refId":"A"}],"range":{"from":"now-1h","to":"now"}}'
          urlDisplayLabel: "Trace saga"
