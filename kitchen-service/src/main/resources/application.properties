server.port=8083
spring.application.name=kitchen-service

spring.datasource.url=jdbc:postgresql://localhost:5432/kitchendb_tram
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
eventuate.database.schema=public

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Eventuate RabbitMQ publisher \u2014 required in addition to spring.rabbitmq.*
rabbitmq.broker.addresses=localhost:5672

eventuatelocal.zookeeper.connection.string=localhost:2181
eventuate.rabbitmq.partition.count=2

eventuate.tram.outbox.partitioning.partition-count=1

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Must match OUTBOXID of the CDC reader for this service's database
eventuate.outbox.id=3

logging.level.com.saga=DEBUG
logging.level.io.eventuate=INFO
