version: "3.8"

# Infrastructure services — start ONCE and leave running permanently.
# You never need to restart these unless your machine reboots.
#
#   Start:   docker-compose -f docker-compose-infra.yml up -d
#   Stop:    docker-compose -f docker-compose-infra.yml down
#   Status:  docker-compose -f docker-compose-infra.yml ps

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "zookeeper-shell localhost:2181 ls / >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: eventuateio/eventuate-rabbitmq:0.10.1.RELEASE
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672  guest/guest
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  zookeeper-data:
  zookeeper-log:
  rabbitmq-data:
